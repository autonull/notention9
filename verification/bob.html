.property-block {
    transition: all 250ms cubic-bezier(0.4, 0, 0.2, 1);
}
.property-block:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(96, 165, 250, 0.15);
}
/* Success glow animation */
@keyframes property-save-glow {
    0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
    50% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
    100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
}
.property-block.property-saved {
    animation: property-save-glow 600ms ease-out;
}
/* Checkmark appear */
@keyframes checkmark-appear {
    0% { transform: scale(0) rotate(-45deg); opacity: 0; }
    50% { transform: scale(1.2) rotate(0deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
.property-check {
    display: inline-block;
    animation: checkmark-appear 300ms cubic-bezier(0.68, -0.55, 0.265, 1.55);
}
body {
  font-family: 'Inter', sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
/* General Editor Styles */
.ProseMirror {
  outline: none;
  height: 100%;
  width: 100%;
  padding: 1.5rem;
  color: #d1d5db;
  /* text-gray-300 */
  line-height: 1.7;
  white-space: pre-wrap;
  word-wrap: break-word;
}
.ProseMirror:focus {
  outline: none;
}
.ProseMirror[contenteditable='true']:empty:before {
  content: attr(data-placeholder);
  float: left;
  color: #6b7280;
  /* text-gray-500 */
  pointer-events: none;
  height: 0;
}
/* Rich-Text Content Styles */
.note-content a,
.suggestion-note {
  color: #60a5fa;
  /* blue-400 */
  text-decoration: underline;
  cursor: pointer;
}
.note-content a:hover,
.suggestion-note:hover {
  color: #93c5fd;
  /* blue-300 */
}
.note-content p {
  margin-bottom: 0.75rem;
}
.note-content h1,
.note-content h2,
.note-content h3 {
  font-weight: 600;
  color: #f3f4f6;
  /* text-gray-100 */
  margin-bottom: 0.5rem;
  margin-top: 1.5rem;
}
.note-content h1 {
  font-size: 1.875rem;
  line-height: 2.25rem;
}
.note-content h2 {
  font-size: 1.5rem;
  line-height: 2rem;
}
.note-content h3 {
  font-size: 1.25rem;
  line-height: 1.75rem;
}
.note-content ul,
.note-content ol {
  padding-left: 1.5rem;
  margin-bottom: 1rem;
}
.note-content ul {
  list-style-type: disc;
}
.note-content ol {
  list-style-type: decimal;
}
.note-content li>p {
  margin-bottom: 0.25rem;
}
.note-content blockquote {
  border-left: 3px solid #4b5563;
  /* gray-600 */
  padding-left: 1rem;
  color: #9ca3af;
  /* gray-400 */
  margin-left: 0.5rem;
}
.note-content code {
  background-color: #1f2937;
  /* gray-800 */
  color: #e5e7eb;
  /* gray-200 */
  padding: 0.1rem 0.3rem;
  border-radius: 0.25rem;
  font-family: monospace;
}
.note-content pre {
  background-color: #111827;
  /* gray-900 */
  color: #e5e7eb;
  /* gray-200 */
  padding: 0.75rem 1rem;
  border-radius: 0.5rem;
  overflow-x: auto;
}
.note-content pre code {
  padding: 0;
  background: none;
}
.note-content hr {
  border-top: 1px solid #374151;
  /* gray-700 */
  margin: 1.5rem 0;
}
.note-content u {
  text-decoration: underline;
}
/* Semantic Element & Widget Styles */
.widget {
  display: inline-flex;
  align-items: baseline;
  white-space: nowrap;
  border-radius: 0.375rem;
  /* rounded-md */
  padding: 0.1rem 0.5rem;
  font-weight: 500;
  user-select: none;
  cursor: pointer;
  transition:
    background-color 0.2s,
    box-shadow 0.2s;
  border: 1px solid transparent;
}
.widget:hover {
  background-color: #4b5563;
  /* gray-600 */
}
.widget.is-editing {
  background-color: #374151;
  /* gray-700 */
  border-color: #60a5fa;
  /* blue-400 */
  box-shadow: 0 0 0 1px #60a5fa;
}
.tag {
  background-color: #2563eb;
  /* blue-600 */
  color: white;
  font-size: 0.875rem;
  border-radius: 9999px;
  /* rounded-full */
}
.property {
  background-color: #374151;
  /* gray-700 */
  color: #d1d5db;
  /* gray-300 */
  font-family: monospace;
  font-size: 0.875rem;
}
.property-key {
  color: #a5b4fc;
  /* indigo-300 */
}
.property-operator {
  color: #fca5a5;
  /* red-300 */
  font-weight: 700;
  margin: 0 0.25rem;
  opacity: 0.9;
}
.property-value {
  color: #6ee7b7;
  /* green-300 */
  min-width: 1ch;
  display: inline-block;
}
.property-value:empty::before {
  content: 'value?';
  color: #9ca3af;
  /* gray-400 */
  font-style: italic;
  opacity: 0.7;
}
/* Leaflet map container height */
.leaflet-container {
  height: 100%;
  width: 100%;
  border-radius: 0.5rem;
  /* rounded-lg */
  z-index: 1;
  /* Ensure map is behind controls */
}
/* Fix for Leaflet popups in dark mode */
.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
  background: #1f2937 !important;
  /* gray-800 */
  color: #d1d5db !important;
  /* gray-300 */
  box-shadow: 0 3px 14px rgba(0, 0, 0, 0.4) !important;
}
.leaflet-popup-content-wrapper a {
  color: #60a5fa !important;
  /* blue-400 */
}
.leaflet-container a.leaflet-popup-close-button {
  color: #d1d5db !important;
}
/* General animation */
@keyframes fade-in {
  from {
    opacity: 0;
    transform: translateY(-5px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.animate-fade-in {
  animation: fade-in 0.3s ease-out forwards;
}
/* Custom Scrollbar */
.custom-scrollbar::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
.custom-scrollbar::-webkit-scrollbar-track {
  background: transparent;
}
.custom-scrollbar::-webkit-scrollbar-thumb {
  background: #4b5563;
  /* gray-600 */
  border-radius: 3px;
}
.custom-scrollbar::-webkit-scrollbar-thumb:hover {
  background: #6b7280;
  /* gray-500 */
}

.rbc-calendar {

.rbc-toolbar button {

}
.rbc-off-range-bg {
  background: #111827;
}
.rbc-today {

}
