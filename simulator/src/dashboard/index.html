<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notention Simulator Dashboard</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #252525;
            padding: 10px 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { margin: 0; font-size: 1.2rem; font-weight: 600; }
        .stats { font-size: 0.9rem; color: #aaa; display: flex; gap: 20px; }

        #main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #agent-grid {
            flex: 3;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 10px;
            padding: 10px;
            overflow-y: auto;
            background-color: #111;
        }

        .agent-frame-container {
            background: #222;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 400px;
        }

        .agent-header {
            padding: 5px 10px;
            background: #2a2a2a;
            font-size: 0.8rem;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
        }

        .agent-role {
            font-weight: bold;
            color: #4CAF50;
        }

        iframe {
            flex: 1;
            border: none;
            width: 100%;
            height: 100%;
            background: white; /* UI is likely light/dark aware, but default white ensures visibility if loading */
        }

        #activity-feed {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
            background: #1e1e1e;
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .feed-header {
            padding: 10px;
            border-bottom: 1px solid #333;
            font-weight: bold;
            background: #252525;
        }

        #events-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .event-item {
            margin-bottom: 8px;
            padding: 8px;
            background: #2a2a2a;
            border-radius: 4px;
            border-left: 3px solid #666;
            animation: fadeIn 0.3s ease;
        }
        .event-item.kind-1 { border-color: #2196F3; } /* Note */
        .event-item.kind-35000 { border-color: #9C27B0; } /* Semantic */

        .timestamp { color: #888; font-size: 0.7rem; float: right; }
        .content { margin-top: 4px; word-break: break-word; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <header>
        <h1>🤖 Notention Simulator</h1>
        <div class="stats">
            <span id="event-count">Events: 0</span>
            <span id="agent-count">Agents: 0</span>
            <span id="status">Connecting...</span>
        </div>
    </header>
    <div id="main-container">
        <div id="agent-grid"></div>
        <div id="activity-feed">
            <div class="feed-header">Relay Activity</div>
            <div id="events-list"></div>
        </div>
    </div>

    <script>
        // Injected by server
        const agents = window.AGENTS || [];
        const relayUrl = window.RELAY_URL || 'ws://localhost:4444';
        const uiPort = window.UI_PORT || 5173;

        // Render Agents
        const grid = document.getElementById('agent-grid');
        document.getElementById('agent-count').innerText = `Agents: ${agents.length}`;

        agents.forEach((agent, index) => {
            const container = document.createElement('div');
            container.className = 'agent-frame-container';

            // Generate subdomain URL
            // Assuming we are running on localhost, use lvh.me for subdomains
            // agent.id is usually 8 chars.
            const url = `http://${agent.id}.lvh.me:${uiPort}/`;

            container.innerHTML = `
                <div class="agent-header">
                    <span class="agent-name">${agent.name}</span>
                    <span class="agent-role">${agent.role}</span>
                </div>
                <iframe src="${url}" title="${agent.name}"></iframe>
            `;
            grid.appendChild(container);
        });

        // Connect to Relay
        const statusEl = document.getElementById('status');
        const countEl = document.getElementById('event-count');
        const listEl = document.getElementById('events-list');
        let eventCount = 0;

        function connect() {
            const ws = new WebSocket(relayUrl);

            ws.onopen = () => {
                statusEl.innerText = 'Connected';
                statusEl.style.color = '#4CAF50';
                // Subscribe to all events
                ws.send(JSON.stringify(['REQ', 'monitor', { limit: 50 }]));
            };

            ws.onclose = () => {
                statusEl.innerText = 'Disconnected';
                statusEl.style.color = '#f44336';
                setTimeout(connect, 3000);
            };

            ws.onmessage = (msg) => {
                const data = JSON.parse(msg.data);
                if (data[0] === 'EVENT') {
                    const event = data[2];
                    addEvent(event);
                }
            };
        }

        function addEvent(event) {
            eventCount++;
            countEl.innerText = `Events: ${eventCount}`;

            const item = document.createElement('div');
            item.className = `event-item kind-${event.kind}`;

            const time = new Date(event.created_at * 1000).toLocaleTimeString();
            let content = event.content || '';

            // Format semantic notes
            if (event.kind === 35000) {
                content = content.length > 100 ? content.slice(0, 100) + '...' : content;
            }

            item.innerHTML = `
                <span class="timestamp">${time}</span>
                <div style="font-weight:bold; font-size:0.8rem">${event.pubkey.slice(0,8)} (Kind ${event.kind})</div>
                <div class="content">${content}</div>
            `;

            listEl.prepend(item);
            if (listEl.children.length > 50) {
                listEl.lastElementChild.remove();
            }
        }

        connect();
    </script>
</body>
</html>
