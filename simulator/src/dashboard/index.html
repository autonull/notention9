<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notention Simulator Dashboard</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #252525;
            padding: 10px 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        h1 { margin: 0; font-size: 1.2rem; font-weight: 600; }
        .stats { font-size: 0.9rem; color: #aaa; display: flex; gap: 20px; flex-wrap: wrap; }
        .status-connected { color: #4CAF50; }
        .status-disconnected { color: #f44336; }
        .status-connecting { color: #FFC107; }

        #main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        #agent-grid {
            flex: 3;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 10px;
            padding: 10px;
            overflow-y: auto;
            background-color: #111;
            min-width: 0;
        }

        .agent-frame-container {
            background: #222;
            border: 2px solid transparent;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 400px;
            transition: border-color 0.3s ease, transform 0.2s;
        }

        .agent-frame-container.active {
            border-color: #4CAF50;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.3);
            z-index: 10;
        }

        .agent-frame-container.focused {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 999;
            border-radius: 0;
            border: none;
        }

        .agent-frame-container.hidden {
            display: none;
        }

        .agent-header {
            padding: 5px 10px;
            background: #2a2a2a;
            font-size: 0.8rem;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .agent-name {
            font-weight: 600;
            color: #e0e0e0;
        }

        .agent-role {
            font-weight: bold;
            color: #4CAF50;
            font-size: 0.7rem;
            background: rgba(76, 175, 80, 0.15);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .agent-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
            transition: background 0.3s;
        }
        .agent-status.online { background: #4CAF50; box-shadow: 0 0 8px #4CAF50; }
        .agent-status.active { background: #FFC107; box-shadow: 0 0 8px #FFC107; }

        iframe {
            flex: 1;
            border: none;
            width: 100%;
            height: 100%;
            background: white;
        }

        #activity-feed {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
            background: #1e1e1e;
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .feed-header {
            padding: 10px;
            border-bottom: 1px solid #333;
            font-weight: bold;
            background: #252525;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .feed-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .search-box {
            padding: 4px 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 0.8rem;
            width: 180px;
            outline: none;
        }
        .search-box:focus {
            border-color: #4CAF50;
        }

        .btn {
            padding: 4px 10px;
            background: #333;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { background: #444; border-color: #555; }
        .btn:active { transform: scale(0.98); }
        .btn.primary { background: #4CAF50; border-color: #4CAF50; }
        .btn.primary:hover { background: #45a049; }
        .btn.danger { background: #d32f2f; border-color: #d32f2f; }
        .btn.danger:hover { background: #c62828; }

        #events-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .event-item {
            margin-bottom: 8px;
            padding: 8px;
            background: #2a2a2a;
            border-radius: 4px;
            border-left: 3px solid #666;
            animation: fadeIn 0.3s ease;
        }
        .event-item.kind-1 { border-color: #2196F3; }
        .event-item.kind-35000 { border-color: #9C27B0; }
        .event-item.kind-35001 { border-color: #FFC107; background: #332b00; }
        .event-item.hidden { display: none; }

        .timestamp { color: #888; font-size: 0.7rem; float: right; }
        .event-kind { font-weight: bold; font-size: 0.8rem; margin-bottom: 2px; }
        .content { margin-top: 4px; word-break: break-word; line-height: 1.4; }

        #caption-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 500;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            text-align: center;
            max-width: 80%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        #explanation-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid #555;
            padding: 20px;
            border-radius: 8px;
            color: #eee;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            backdrop-filter: blur(5px);
        }

        #explanation-modal pre {
            background: #111;
            padding: 10px;
            overflow: auto;
            border-radius: 4px;
            max-height: 400px;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Mobile responsive */
        @media (max-width: 1024px) {
            #main-container {
                flex-direction: column;
            }
            #activity-feed {
                max-width: none;
                min-width: 0;
                border-left: none;
                border-top: 1px solid #333;
                max-height: 40vh;
            }
            #agent-grid {
                grid-template-columns: 1fr;
                min-height: 60vh;
            }
            .stats { font-size: 0.8rem; gap: 10px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .event-item, .agent-frame-container, #caption-overlay, #explanation-modal {
                animation: none !important;
                transition: none !important;
            }
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body>
    <header>
        <h1>🤖 Notention Simulator</h1>
        <div class="stats">
            <span id="event-count">Events: 0</span>
            <span id="agent-count">Agents: 0</span>
            <span id="status" class="status-connecting">Connecting...</span>
        </div>
    </header>
    <div id="main-container">
        <div id="agent-grid"></div>
        <div id="activity-feed">
            <div class="feed-header">
                <span>Relay Activity</span>
                <div class="feed-controls">
                    <input type="text" class="search-box" id="event-search" placeholder="Filter events..." aria-label="Filter events">
                    <button class="btn" id="clear-events" title="Clear event log">Clear</button>
                    <button class="btn primary" id="export-events" title="Export events as JSON">Export</button>
                    <button class="btn" id="pause-events" title="Pause/Resume event updates">Pause</button>
                </div>
            </div>
            <div id="events-list"></div>
        </div>
        <div id="caption-overlay"></div>
        <div id="explanation-modal">
            <h3>🧩 Match Explained</h3>
            <div id="explanation-content"></div>
        </div>
    </div>

    <script>
        // Injected by server
        const agents = window.AGENTS || [];
        const relayUrl = window.RELAY_URL || 'ws://localhost:4444';
        const uiPort = window.UI_PORT || 5173;

        // Render Agents
        const grid = document.getElementById('agent-grid');
        document.getElementById('agent-count').innerText = `Agents: ${agents.length}`;

        // Map pubkey (first 8 chars) to DOM element for highlighting
        const agentElements = {};
        const agentStatusElements = {};

        agents.forEach((agent, index) => {
            const container = document.createElement('div');
            container.className = 'agent-frame-container';
            container.id = `agent-${agent.id}`;

            // Use localhost for all agents (browser contexts provide isolation)
            const url = `http://localhost:${uiPort}/`;

            container.innerHTML = `
                <div class="agent-header">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="agent-status" id="status-${agent.id}"></span>
                        <span class="agent-name">${agent.name}</span>
                    </div>
                    <span class="agent-role">${agent.role}</span>
                </div>
                <iframe src="${url}" title="${agent.name}"></iframe>
            `;
            grid.appendChild(container);
            agentElements[agent.id] = container;
            agentStatusElements[agent.id] = document.getElementById(`status-${agent.id}`);
        });

        // Audio Context for SFX
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'publish') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'match') {
                [440, 554, 659].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'triangle';
                    o.frequency.value = freq;
                    g.gain.setValueAtTime(0.1, now + i*0.05);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i*0.05 + 0.3);
                    o.start(now + i*0.05);
                    o.stop(now + i*0.05 + 0.3);
                });
            }
        }

        // Caption Logic
        const captionEl = document.getElementById('caption-overlay');
        const explanationEl = document.getElementById('explanation-modal');
        const explanationContent = document.getElementById('explanation-content');
        let captionTimeout;
        let explanationTimeout;

        // Camera Focus Logic
        window.setCameraFocus = function(agentId) {
            const all = document.querySelectorAll('.agent-frame-container');
            const target = document.getElementById(`agent-${agentId}`);

            if (!agentId || agentId === 'grid' || !target) {
                all.forEach(el => {
                    el.classList.remove('focused', 'hidden');
                    el.style.display = '';
                });
                grid.style.display = 'grid';
                showCaption("Camera: Grid View");
                return;
            }

            showCaption(`Camera: Focused on ${agentId}`);
            all.forEach(el => {
                if (el.id === `agent-${agentId}`) {
                    el.classList.add('focused');
                    el.classList.remove('hidden');
                } else {
                    el.classList.remove('focused');
                    el.classList.add('hidden');
                }
            });
        };

        function showCaption(text) {
            captionEl.innerText = text;
            captionEl.style.opacity = '1';
            clearTimeout(captionTimeout);
            captionTimeout = setTimeout(() => {
                captionEl.style.opacity = '0';
            }, 3000);
        }

        function showExplanation(data) {
            const pretty = JSON.stringify(data, null, 2);
            explanationContent.innerHTML = `<pre>${pretty}</pre>`;
            explanationEl.style.opacity = '1';

            clearTimeout(explanationTimeout);
            explanationTimeout = setTimeout(() => {
                explanationEl.style.opacity = '0';
            }, 6000);
        }

        // Event Feed Logic
        const statusEl = document.getElementById('status');
        const countEl = document.getElementById('event-count');
        const listEl = document.getElementById('events-list');
        const searchBox = document.getElementById('event-search');
        const clearBtn = document.getElementById('clear-events');
        const exportBtn = document.getElementById('export-events');
        const pauseBtn = document.getElementById('pause-events');

        let eventCount = 0;
        let allEvents = [];
        let paused = false;
        let searchQuery = '';

        clearBtn.addEventListener('click', () => {
            allEvents = [];
            listEl.innerHTML = '';
            eventCount = 0;
            countEl.innerText = `Events: 0`;
        });

        exportBtn.addEventListener('click', () => {
            const blob = new Blob([JSON.stringify(allEvents, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `simulator-events-${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.json`;
            a.click();
            URL.revokeObjectURL(url);
        });

        pauseBtn.addEventListener('click', () => {
            paused = !paused;
            pauseBtn.textContent = paused ? 'Resume' : 'Pause';
            pauseBtn.classList.toggle('primary', !paused);
        });

        searchBox.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            filterEvents();
        });

        function filterEvents() {
            const items = listEl.querySelectorAll('.event-item');
            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                item.classList.toggle('hidden', !text.includes(searchQuery));
            });
        }

        // Connect to Relay
        function connect() {
            const ws = new WebSocket(relayUrl);

            ws.onopen = () => {
                statusEl.innerText = 'Connected';
                statusEl.className = 'status-connected';
                ws.send(JSON.stringify(['REQ', 'monitor', { limit: 50 }]));
            };

            ws.onclose = () => {
                statusEl.innerText = 'Disconnected';
                statusEl.className = 'status-disconnected';
                // Mark all agents as offline
                Object.values(agentStatusElements).forEach(el => {
                    if (el) el.className = 'agent-status';
                });
                setTimeout(connect, 3000);
            };

            ws.onmessage = (msg) => {
                const data = JSON.parse(msg.data);
                if (data[0] === 'EVENT') {
                    const event = data[2];
                    handleEvent(event);
                }
            };
        }

        function handleEvent(event) {
            if (!paused) {
                addToList(event);
            }

            const shortId = event.pubkey.slice(0, 8);
            const el = agentElements[shortId];
            const statusEl = agentStatusElements[shortId];

            // Highlight Agent
            if (el) {
                el.classList.add('active');
                setTimeout(() => el.classList.remove('active'), 1000);
            }

            // Update agent status indicator
            if (statusEl) {
                statusEl.className = 'agent-status active';
                setTimeout(() => {
                    statusEl.className = 'agent-status online';
                }, 2000);
            }

            // Determine Agent Name
            const agent = agents.find(a => a.id === shortId);
            const name = agent ? agent.name : shortId;

            // Logic by Kind
            if (event.kind === 35000) {
                playSound('publish');
                const inputMethodTag = event.tags.find(t => t[0] === 'input-method');
                const method = inputMethodTag ? inputMethodTag[1] : 'raw';
                showCaption(`${name} published an intent via ${method} input.`);
            } else if (event.kind === 35001) {
                playSound('match');
                const explanation = JSON.parse(event.content);
                showCaption(`${name} found a match!`);
                showExplanation(explanation);
            }
        }

        function addToList(event) {
            eventCount++;
            countEl.innerText = `Events: ${eventCount}`;

            // Store event for export
            allEvents.push(event);
            if (allEvents.length > 500) allEvents.shift();

            const item = document.createElement('div');
            item.className = `event-item kind-${event.kind}`;

            const time = new Date(event.created_at * 1000).toLocaleTimeString();
            let content = event.content || '';

            if (event.kind === 35000) {
                content = content.length > 100 ? content.slice(0, 100) + '...' : content;
            } else if (event.kind === 35001) {
                content = "Match Explanation Details...";
            }

            const kindLabels = { 1: 'Note', 35000: 'Intent', 35001: 'Match' };
            const kindLabel = kindLabels[event.kind] || `Kind ${event.kind}`;

            item.innerHTML = `
                <span class="timestamp">${time}</span>
                <div class="event-kind">${event.pubkey.slice(0,8)} (${kindLabel})</div>
                <div class="content">${content}</div>
            `;

            listEl.prepend(item);
            if (listEl.children.length > 100) {
                listEl.lastElementChild.remove();
            }
        }

        // Initialize agent statuses as offline
        Object.values(agentStatusElements).forEach(el => {
            if (el) el.className = 'agent-status';
        });

        connect();
    </script>
</body>
</html>
