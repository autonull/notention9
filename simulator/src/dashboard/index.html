<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notention Simulator Dashboard</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #252525;
            padding: 10px 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { margin: 0; font-size: 1.2rem; font-weight: 600; }
        .stats { font-size: 0.9rem; color: #aaa; display: flex; gap: 20px; }

        #main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        #agent-grid {
            flex: 3;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 10px;
            padding: 10px;
            overflow-y: auto;
            background-color: #111;
        }

        .agent-frame-container {
            background: #222;
            border: 2px solid transparent;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 400px;
            transition: border-color 0.3s ease, transform 0.2s;
        }

        .agent-frame-container.active {
            border-color: #4CAF50;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.3);
            z-index: 10;
        }

        .agent-header {
            padding: 5px 10px;
            background: #2a2a2a;
            font-size: 0.8rem;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
        }

        .agent-role {
            font-weight: bold;
            color: #4CAF50;
        }

        iframe {
            flex: 1;
            border: none;
            width: 100%;
            height: 100%;
            background: white;
        }

        #activity-feed {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
            background: #1e1e1e;
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .feed-header {
            padding: 10px;
            border-bottom: 1px solid #333;
            font-weight: bold;
            background: #252525;
        }

        #events-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .event-item {
            margin-bottom: 8px;
            padding: 8px;
            background: #2a2a2a;
            border-radius: 4px;
            border-left: 3px solid #666;
            animation: fadeIn 0.3s ease;
        }
        .event-item.kind-1 { border-color: #2196F3; } /* Note */
        .event-item.kind-35000 { border-color: #9C27B0; } /* Semantic */

        .timestamp { color: #888; font-size: 0.7rem; float: right; }
        .content { margin-top: 4px; word-break: break-word; }

        #caption-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: 500;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            text-align: center;
            max-width: 80%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 100;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <header>
        <h1>🤖 Notention Simulator</h1>
        <div class="stats">
            <span id="event-count">Events: 0</span>
            <span id="agent-count">Agents: 0</span>
            <span id="status">Connecting...</span>
        </div>
    </header>
    <div id="main-container">
        <div id="agent-grid"></div>
        <div id="activity-feed">
            <div class="feed-header">Relay Activity</div>
            <div id="events-list"></div>
        </div>
        <div id="caption-overlay"></div>
    </div>

    <script>
        // Injected by server
        const agents = window.AGENTS || [];
        const relayUrl = window.RELAY_URL || 'ws://localhost:4444';
        const uiPort = window.UI_PORT || 5173;

        // Render Agents
        const grid = document.getElementById('agent-grid');
        document.getElementById('agent-count').innerText = `Agents: ${agents.length}`;

        // Map pubkey (first 8 chars) to DOM element for highlighting
        const agentElements = {};

        agents.forEach((agent, index) => {
            const container = document.createElement('div');
            container.className = 'agent-frame-container';
            container.id = `agent-${agent.id}`;

            // Generate subdomain URL
            const url = `http://${agent.id}.lvh.me:${uiPort}/`;

            container.innerHTML = `
                <div class="agent-header">
                    <span class="agent-name">${agent.name}</span>
                    <span class="agent-role">${agent.role}</span>
                </div>
                <iframe src="${url}" title="${agent.name}"></iframe>
            `;
            grid.appendChild(container);
            agentElements[agent.id] = container;
        });

        // Audio Context for SFX
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'publish') {
                // High pitch beep
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'match') {
                // Major chord arpeggio
                [440, 554, 659].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'triangle';
                    o.frequency.value = freq;
                    g.gain.setValueAtTime(0.1, now + i*0.05);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i*0.05 + 0.3);
                    o.start(now + i*0.05);
                    o.stop(now + i*0.05 + 0.3);
                });
            }
        }

        // Caption Logic
        const captionEl = document.getElementById('caption-overlay');
        let captionTimeout;

        function showCaption(text) {
            captionEl.innerText = text;
            captionEl.style.opacity = '1';
            clearTimeout(captionTimeout);
            captionTimeout = setTimeout(() => {
                captionEl.style.opacity = '0';
            }, 3000);
        }

        // Connect to Relay
        const statusEl = document.getElementById('status');
        const countEl = document.getElementById('event-count');
        const listEl = document.getElementById('events-list');
        let eventCount = 0;

        function connect() {
            const ws = new WebSocket(relayUrl);

            ws.onopen = () => {
                statusEl.innerText = 'Connected';
                statusEl.style.color = '#4CAF50';
                ws.send(JSON.stringify(['REQ', 'monitor', { limit: 50 }]));
            };

            ws.onclose = () => {
                statusEl.innerText = 'Disconnected';
                statusEl.style.color = '#f44336';
                setTimeout(connect, 3000);
            };

            ws.onmessage = (msg) => {
                const data = JSON.parse(msg.data);
                if (data[0] === 'EVENT') {
                    const event = data[2];
                    handleEvent(event);
                }
            };
        }

        function handleEvent(event) {
            addToList(event);

            // Visual Highlight
            const shortId = event.pubkey.slice(0, 8);
            const el = agentElements[shortId];
            if (el) {
                el.classList.add('active');
                setTimeout(() => el.classList.remove('active'), 1000);

                // Determine Agent Name
                const agent = agents.find(a => a.id === shortId);
                const name = agent ? agent.name : shortId;

                // Caption & Sound
                if (event.kind === 35000) {
                    playSound('publish');
                    const inputMethodTag = event.tags.find(t => t[0] === 'input-method');
                    const method = inputMethodTag ? inputMethodTag[1] : 'raw';
                    showCaption(`${name} published an intent via ${method} input.`);
                } else if (event.content.includes("Matched")) {
                    // Simulator logging might publish matches?
                    // Actually simulator logic logs to console, doesn't publish match events yet.
                    // We might need to deduce matches or update simulator to publish "Match" events (Kind 1 maybe?)
                }
            }
        }

        function addToList(event) {
            eventCount++;
            countEl.innerText = `Events: ${eventCount}`;

            const item = document.createElement('div');
            item.className = `event-item kind-${event.kind}`;

            const time = new Date(event.created_at * 1000).toLocaleTimeString();
            let content = event.content || '';

            if (event.kind === 35000) {
                content = content.length > 100 ? content.slice(0, 100) + '...' : content;
            }

            item.innerHTML = `
                <span class="timestamp">${time}</span>
                <div style="font-weight:bold; font-size:0.8rem">${event.pubkey.slice(0,8)} (Kind ${event.kind})</div>
                <div class="content">${content}</div>
            `;

            listEl.prepend(item);
            if (listEl.children.length > 50) {
                listEl.lastElementChild.remove();
            }
        }

        connect();
    </script>
</body>
</html>
